name: JSP000690 complete proof verification
on:
  push:
    branches: [justin-sun-prize-jsp000690]
    paths:
      - justin-sun-prize/JSP000690/complete/**
      - .github/workflows/jsp000690.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.19.0
            mathlib: c44e0c8ee63ca166450922a373c7409c5d26b00b
            archive_sha256: 6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe
          - version: 4.34.0
            mathlib: 5ed2965256430c3649e86755f9576b54eca72435
            archive_sha256: caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test verification harness
        run: |
          set -euo pipefail
          mkdir -p harness-verification
          (cd justin-sun-prize/JSP000690/complete && python3 -m unittest -v test_verify.py) 2>&1 | tee harness-verification/unit-tests.log
      - name: Prepare pinned official toolchain
        env:
          VERSION: ${{ matrix.version }}
          ARCHIVE_SHA: ${{ matrix.archive_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "https://github.com/leanprover/lean4/releases/download/v${VERSION}/lean-${VERSION}-linux.tar.zst" -o lean.tar.zst
          sha256sum lean.tar.zst | tee lean-release.SHA256SUMS
          echo "$ARCHIVE_SHA  lean.tar.zst" | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-${VERSION}-linux/bin" >> "$GITHUB_PATH"
          echo "LEAN_BIN=$PWD/lean-${VERSION}-linux/bin" >> "$GITHUB_ENV"
      - name: Prepare exact Mathlib dependency closure
        env:
          VERSION: ${{ matrix.version }}
          MATHLIB_SHA: ${{ matrix.mathlib }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${VERSION}" https://github.com/leanprover-community/mathlib4.git mathlib
          test "$(git -C mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          cd mathlib
          lake exe cache get Mathlib/Data/Finset/Card.lean Mathlib/Data/Fintype/Pi.lean
          LP=$(lake env python3 -c 'import os; print(":".join(os.path.abspath(p) for p in os.environ["LEAN_PATH"].split(":")))')
          echo "LEAN_PATH=$LP" >> "$GITHUB_ENV"
          git rev-parse HEAD > ../mathlib-revision.txt
          cp lake-manifest.json ../dependency-manifest.json
      - name: Fresh build, axiom audit, replay and negative controls
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          REPLAY=()
          if [ "$VERSION" = 4.34.0 ]; then
            test -x "$LEAN_BIN/leanchecker"
            REPLAY=(--replay "$LEAN_BIN/leanchecker")
          fi
          python3 justin-sun-prize/JSP000690/complete/verify.py --lean "$LEAN_BIN/lean" --expected-version "$VERSION" --out "verification-$VERSION" "${REPLAY[@]}"
      - name: Archive actual source and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp690-verification-${{ matrix.version }}
          path: |
            verification-*/
            harness-verification/
            lean-release.SHA256SUMS
            mathlib-revision.txt
            dependency-manifest.json
            justin-sun-prize/JSP000690/complete/*.lean
            justin-sun-prize/JSP000690/complete/verify.py
            justin-sun-prize/JSP000690/complete/test_verify.py
          retention-days: 14
