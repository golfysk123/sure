name: JSP000690 Lean verification
on:
  push:
    branches: [justin-sun-prize-jsp000690]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl --fail --location https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean.tar.zst
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel check
        run: |
          set -euo pipefail
          lean --version
          lean justin-sun-prize/JSP000690/Prize690.lean | tee verification.log
          ! grep -R -nE '\\b(sorry|admit|native_decide|axiom)\\b' justin-sun-prize/JSP000690/Prize690.lean
          grep -F "depends on axioms: [propext]" verification.log
