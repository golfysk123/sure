name: Erdos906 supporting checks
on:
  push:
    branches: [research/erdos906-minimal-order]
    paths:
      - research/erdos906/**
      - .github/workflows/erdos906-exact-checks.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare bounded numerical environment
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install mpmath==1.3.0
      - name: Reproduce exact and high-precision supporting checks
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python --version | tee evidence/python-version.txt
          .venv/bin/python research/erdos906/check_exact.py | tee evidence/normal.log
          cp evidence/checks.json evidence/checks-normal.json
          .venv/bin/python -O research/erdos906/check_exact.py | tee evidence/optimized.log
          mv evidence/checks.json evidence/checks-optimized.json
          .venv/bin/python research/erdos906/check_deterministic.py --out evidence/deterministic.json | tee evidence/deterministic.log
          .venv/bin/python -O research/erdos906/check_deterministic.py --out evidence/deterministic-optimized.json | tee evidence/deterministic-optimized.log
          .venv/bin/python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          e=root/'evidence'
          normal=json.loads((e/'checks-normal.json').read_text())
          optimized=json.loads((e/'checks-optimized.json').read_text())
          d=json.loads((e/'deterministic.json').read_text())
          do=json.loads((e/'deterministic-optimized.json').read_text())
          if normal['status']!='exact supporting checks passed' or normal['checks']!=optimized['checks']:
              raise RuntimeError('Exact checks did not pass and agree')
          keys=['status','precision_decimal_digits','phase_profile_cases','concavity_tangent_cases','independent_polynomial_cases','negative_controls','rows']
          if d['status']!='high-precision supporting checks passed' or any(d[k]!=do[k] for k in keys):
              raise RuntimeError('High-precision diagnostics did not pass and agree')
          files=list((root/'research/erdos906').glob('*.md'))+list((root/'research/erdos906').glob('*.py'))+[root/'.github/workflows/erdos906-exact-checks.yml']
          receipt={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
              'status':'supporting checks passed','exact_rational_checks':normal['checks'],
              'high_precision_diagnostics':{k:d[k] for k in keys if k!='rows'},
              'analytic_theorems_verified_by_CI':False,'interval_arithmetic_certification_of_diagnostics':False,
              'independent_human_review':False,'novelty_or_prize_eligibility_confirmed':False,
              'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (e/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Archive actual manuscripts, source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos906-manuscripts-and-supporting-evidence
          path: |
            evidence/
            research/erdos906/*.md
            research/erdos906/*.py
            .github/workflows/erdos906-exact-checks.yml
          retention-days: 30
