name: Erdos906 exact supporting checks
on:
  push:
    branches: [research/erdos906-minimal-order]
    paths:
      - research/erdos906/**
      - .github/workflows/erdos906-exact-checks.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact rational checks in normal and optimized Python
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 --version | tee evidence/python-version.txt
          python3 research/erdos906/check_exact.py | tee evidence/normal.log
          cp evidence/checks.json evidence/checks-normal.json
          python3 -O research/erdos906/check_exact.py | tee evidence/optimized.log
          mv evidence/checks.json evidence/checks-optimized.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          e=root/'evidence'
          normal=json.loads((e/'checks-normal.json').read_text())
          optimized=json.loads((e/'checks-optimized.json').read_text())
          if normal['status']!='exact supporting checks passed' or normal['checks']!=optimized['checks']:
              raise RuntimeError('Supporting checks did not pass and agree')
          files=[root/'research/erdos906/minimal-order.md',root/'research/erdos906/check_exact.py',root/'.github/workflows/erdos906-exact-checks.yml']
          receipt={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
              'status':'exact supporting checks passed','checks':normal['checks'],
              'analytic_theorem_verified_by_CI':False,'independent_human_review':False,
              'novelty_or_prize_eligibility_confirmed':False,
              'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (e/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Archive actual manuscript, source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos906-manuscript-and-exact-evidence
          path: |
            evidence/
            research/erdos906/minimal-order.md
            research/erdos906/check_exact.py
            .github/workflows/erdos906-exact-checks.yml
          retention-days: 30
